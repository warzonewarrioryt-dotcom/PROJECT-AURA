<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tamil Nadu Higher Education Curriculum Intelligence Platform (Regulation 2021)</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            slate: {
              850: '#151d2f',
              950: '#060a12',
            }
          }
        }
      }
    };
  </script>

  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone to compile JSX in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    code, pre, .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    /* Custom scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #060a12;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root">
    <div class="min-h-screen flex items-center justify-center p-6 text-slate-400">
      <div class="text-center space-y-3">
        <div class="w-10 h-10 border-2 border-indigo-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
        <p class="text-sm font-medium">Loading Tamil Nadu Curriculum Platform...</p>
      </div>
    </div>
  </div>

  <!-- Synchronous Dataset Injection (Works reliably on both file:// and http://) -->
  <script src="./data.js"></script>

  <!-- Fallback fetch if data.js is not loaded -->
  <script>
    if (!window.__CURRICULUM_DATA__) {
      fetch('./curriculumData.json')
        .then(res => res.json())
        .then(data => {
          window.__CURRICULUM_DATA__ = data;
          window.dispatchEvent(new CustomEvent('curriculum-data-ready', { detail: data }));
        })
        .catch(err => {
          console.warn('Fallback JSON fetch failed:', err);
        });
    }
  </script>

  <!-- Application Script compiled by Babel Standalone -->
  <script type="text/babel" src="./app.jsx"></script>
</body>
</html>
