<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tamil Nadu Higher Education Curriculum Intelligence Platform (Regulation 2021)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            slate: {
              850: '#151d2f',
              950: '#060a12',
            }
          }
        }
      }
    };
  </script>
  <!-- React 18, ReactDOM, and Babel Standalone for live client execution -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    code, pre, .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    /* Custom scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #060a12;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <!-- Load Curriculum Data -->
  <script>
    // Fetch curriculumData.json and mount app
    fetch('./curriculumData.json')
      .then(res => res.json())
      .then(data => {
        window.__CURRICULUM_DATA__ = data;
        const script = document.createElement('script');
        script.type = 'text/babel';
        script.src = './app.jsx';
        document.body.appendChild(script);
      })
      .catch(err => {
        console.error('Failed to load curriculumData.json:', err);
        document.getElementById('root').innerHTML = `
          <div class="p-8 text-center text-red-400">
            Failed to load curriculumData.json. Ensure file is accessible via local server.
          </div>
        `;
      });
  </script>
</body>
</html>
